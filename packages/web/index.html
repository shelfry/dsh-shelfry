<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSH 插件集市</title>
    <meta name="description" content="DeepSeek Harness 插件集市 —— 按星标与更新活跃度排序，一页看清哪个插件值得装。" />
    <!-- canonical 由各页 useSeo 在渲染后写入：所有路由共用同一份 HTML，静态写死会指错页面 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DSH 插件集市" />
    <meta property="og:title" content="DSH 插件集市 · 收录 20000+ 个 DeepSeek Harness 插件" />
    <meta property="og:description" content="按星标、下载量与更新活跃度排序，支持分类筛选与全文搜索，每日自动刷新。" />
    <meta property="og:url" content="https://shelfry.app/" />
    <meta property="og:image" content="https://shelfry.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DSH 插件集市：DeepSeek Harness 插件与工具目录" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DSH 插件集市" />
    <meta name="twitter:description" content="收录 20000+ 个 DeepSeek Harness 插件，按星标与活跃度排序，每日自动刷新。" />
    <meta name="twitter:image" content="https://shelfry.app/og.png" />
    <meta name="theme-color" content="#f7f7f5" />
    <!-- 首屏先按本地偏好落一次主题与语言，深色用户不会看到白闪 -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var mode = localStorage.getItem("dsh:theme") || "system";
          var dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          root.dataset.theme = dark ? "dark" : "light";
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          root.dataset.theme = "light";
        }
        try {
          if (localStorage.getItem("dsh:lang") === "en") root.lang = "en";
        } catch (e) {}
        // 旧链接是 hash 路由（#/p/x、#/?scope=tools），在 React 挂载前改写成真实路径，
        // 已分享出去的地址不会失效，也不会先闪一下首页。
        try {
          var hash = location.hash;
          if (hash.indexOf("#/") === 0) {
            var rest = hash.slice(2);
            var q = rest.indexOf("?");
            var path = q === -1 ? rest : rest.slice(0, q);
            var query = q === -1 ? "" : rest.slice(q);
            history.replaceState(null, "", "/" + path + query + location.search);
          }
        } catch (e) {}
      })();
    </script>
    <!-- 纯矢量包裹图标（牛皮纸配色 K1，圆角 12）：不依赖系统 emoji 字体，Windows 上不会退化成缺字方块 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='12' fill='%23a9713f'/%3E%3Cpath d='M50 22 L78 36 L50 50 L22 36 Z' fill='%23f5dfc0'/%3E%3Cpath d='M22 36 L50 50 L50 82 L22 68 Z' fill='%23eac9a0'/%3E%3Cpath d='M78 36 L50 50 L50 82 L78 68 Z' fill='%23d9ae7f'/%3E%3Crect x='44' y='50' width='12' height='32' fill='%23fdf3e3'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- 51.LA 统计：单页应用只加载一次，所有 hash 路由共用这一份上报 -->
    <script charset="UTF-8" id="LA_COLLECT" src="//sdk.51.la/js-sdk-pro.min.js"></script>
    <script>LA.init({id:"LMKP2jgh6NXo1civ",ck:"LMKP2jgh6NXo1civ"})</script>
  </body>
</html>
