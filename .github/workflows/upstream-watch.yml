# 上游同步巡检：每天检查上游有没有新版本，有则把体检报告发到飞书。
# 只检测与通知，不合并、不提交、不改工作区；真正的合并仍由人工确认后执行。
name: upstream-watch

on:
  schedule:
    # GitHub 的 cron 按 UTC 计时：01:00 UTC = 北京时间 09:00，09:00 UTC = 北京时间 17:00。
    # 定时触发是 best-effort，漏跑无法避免，所以再加一条晚间的做兜底。
    - cron: '0 1 * * *'
    - cron: '0 9 * * *'
  # 每次推到 main 就顺带巡检一次：合并完成后基线已更新，正常不会发消息；
  # 上游发版而基线没跟上的情况会立刻提醒，不依赖定时器是否跑成功。
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 跳过「有无新版本」判断，直接发一条通知用于测试
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: upstream-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 完整历史：同步脚本要按标签区间读提交与文件内容。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 检测上游是否有新版本
        id: detect
        run: |
          git remote add upstream https://github.com/dsh-market/dsh-market.git
          git fetch upstream --tags --quiet

          LATEST="$(git ls-remote --tags --refs upstream \
            | awk -F/ '{print $NF}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n 1 || true)"
          BASE="$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+ → v[0-9]+\.[0-9]+\.[0-9]+' UPSTREAM.md \
            | tail -n 1 | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+$' || true)"

          echo "上游最新：${LATEST:-未找到}；本地基线：${BASE:-未找到}"
          if [ -z "$LATEST" ] || [ -z "$BASE" ]; then
            echo "::error::无法确定上游版本或同步基线，请检查 UPSTREAM.md 同步记录"
            exit 1
          fi

          if [ "$LATEST" = "$BASE" ]; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成体检报告
        if: steps.detect.outputs.has_updates == 'true' || inputs.force
        run: npm run sync:upstream | tee report.txt

      - name: 发送飞书通知
        if: steps.detect.outputs.has_updates == 'true' || inputs.force
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: |
          node scripts/notify-feishu.mjs \
            --file report.txt \
            --title "上游有新版本" \
            --link "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
