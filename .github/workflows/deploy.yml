name: Build and deploy site

# 触发：主分支推送 / 每天定时刷新数据 / 手动触发。
# 数据产物不进 git —— 每次都在 CI 里跑收录管道生成，Pages 只收构建好的静态站。
on:
  push:
    branches: [main]
  schedule:
    # 每天 UTC 18:17（北京 02:17）刷新收录数据
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      rescue:
        description: "一次性补录：逗号分隔的 owner/repo 列表（留空则正常收录）"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # 一次构建最多收录多少条（按检索查询分片；站点不做安装验证，构建只剩收录+静态化）。
  COLLECT_LIMIT: 20000

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 恢复收录缓存
        # .data 里存着上一轮的 catalog 与 npm 下载量缓存：
        # 版本号/下载量未过期就跳过查询，避免每天重查几百个 scoped 包（单次 CI 从 9 分钟回到 1 分钟级）。
        uses: actions/cache@v4
        with:
          path: .data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: 跑收录管道
        # GH_SEARCH_TOKEN 未配置时自动降级到镜像种子源（收集器内置 --source auto 兜底）。
        env:
          GITHUB_TOKEN: ${{ secrets.GH_SEARCH_TOKEN || github.token }}
          RESCUE_REPOS: ${{ inputs.rescue || '' }}
        run: npm run collect -- --source auto --limit ${{ env.COLLECT_LIMIT }} --build

      - name: 构建静态站
        run: npm run build

      - name: 部署到 Cloudflare Pages
        # 深链由 _redirects 回退到 index.html，不再需要 GitHub Pages 的 404 兜底
        run: npx --yes wrangler@4 pages deploy packages/web/dist --project-name dsh-shelfry --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 切换期间保留 GitHub Pages 作为回滚路径，确认 Cloudflare 稳定后再移除
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 失败告警：构建或部署挂了就在仓库里开 Issue。
  # 定时任务（凌晨 2:17）失败时没人盯着页面，只能靠 Issue 把问题推到眼前。
  notify-failure:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const label = 'ci-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `**工作流**：${context.workflow}`,
              `**触发方式**：${context.eventName}`,
              `**提交**：\`${context.sha.slice(0, 7)}\``,
              `**运行记录**：${runUrl}`,
              '',
              '收录或部署失败后站点不会更新，请打开运行记录看日志。修复后关掉这个 Issue 即可，下次再失败会重新开一条。',
            ].join('\n');

            // 标签不存在时 create 会 422，先补一个
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd0453c' });
            }

            // 已有未关闭的告警就追加评论：每天定时失败不该刷出一堆重复 Issue
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: label, per_page: 1,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: `CI 失败：${context.workflow}（${context.eventName}）`,
                body,
                labels: [label],
              });
            }
